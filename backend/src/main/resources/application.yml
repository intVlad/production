spring:
  jackson:
    serialization:
      fail-on-empty-beans: false
  datasource:
    # Use Postgres if env vars are present (e.g. Docker/GCP), otherwise default to H2 in-memory
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:production_mvp;DB_CLOSE_DELAY=-1}
    # The driver is deliberately not pinned here. It used to default to org.h2.Driver, which
    # meant anyone setting only SPRING_DATASOURCE_URL to a Postgres address - as
    # docker-compose.yml did - got the H2 driver handed a Postgres URL and a failure to start.
    # Spring Boot infers the driver from the URL, so one variable is enough to switch database.
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  h2:
    console:
      # Only useful when actually running on H2, and it has no business being reachable on a
      # real deployment. Spring Security already requires authentication for it, but a browser
      # SQL console is not something to leave switched on and rely on one guard for.
      enabled: ${H2_CONSOLE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Let Spring Boot auto-detect dialect based on driver/url (works for both H2 and Postgres)
        # dialect: org.hibernate.dialect.H2Dialect

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:c2VjdXJlLXByb2R1Y3Rpb24tbXZwLWp3dC1zZWNyZXQta2V5LTI1Ni1iaXRzLW1pbmltdW0tcmVxdWlyZWQ=}
  expiration-ms: 28800000
