spring:
  lifecycle:
    # How long graceful shutdown waits for in-flight requests before giving up.
    timeout-per-shutdown-phase: 25s
  jackson:
    serialization:
      fail-on-empty-beans: false
  datasource:
    # Use Postgres if env vars are present (e.g. Docker/GCP), otherwise default to H2 in-memory
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:production_mvp;DB_CLOSE_DELAY=-1}
    # The driver is deliberately not pinned here. It used to default to org.h2.Driver, which
    # meant anyone setting only SPRING_DATASOURCE_URL to a Postgres address - as
    # docker-compose.yml did - got the H2 driver handed a Postgres URL and a failure to start.
    # Spring Boot infers the driver from the URL, so one variable is enough to switch database.
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  h2:
    console:
      # Only useful when actually running on H2, and it has no business being reachable on a
      # real deployment. Spring Security already requires authentication for it, but a browser
      # SQL console is not something to leave switched on and rely on one guard for.
      enabled: ${H2_CONSOLE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Let Spring Boot auto-detect dialect based on driver/url (works for both H2 and Postgres)
        # dialect: org.hibernate.dialect.H2Dialect

server:
  # Railway (and most platforms) assign the port at runtime and expect the app to use it.
  port: ${PORT:8080}
  # Every hosting platform puts a proxy in front of the application, which terminates TLS and
  # forwards the request internally over plain HTTP. Without this the application believes it
  # is serving http://<internal-host>:8080, so a browser request from its own UI at
  # https://<public-domain> looks like it came from somewhere else entirely - which made
  # Spring treat same-origin requests as cross-origin and reject the login with 403.
  forward-headers-strategy: framework
  # Without this, stopping the old instance during a deploy cuts whatever requests were in
  # flight - an operator's "Завершити" tap turning into an error for no reason. Spring waits
  # for them to finish instead, up to the timeout below.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Health only. The other actuator endpoints expose configuration, environment
        # variables and beans, which is far more than a readiness probe needs to know.
        include: health
  endpoint:
    health:
      # The platform needs to distinguish "still starting" from "up", and a health check that
      # ignores the database would report a healthy instance that cannot serve a single request.
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

jwt:
  secret: ${JWT_SECRET:c2VjdXJlLXByb2R1Y3Rpb24tbXZwLWp3dC1zZWNyZXQta2V5LTI1Ni1iaXRzLW1pbmltdW0tcmVxdWlyZWQ=}
  expiration-ms: 28800000
