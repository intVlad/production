<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - ProdFlow MES</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg-color, #0b0f19);
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
        }
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .login-card h1 {
            margin-bottom: 2rem;
            color: var(--text-primary);
        }
        .role-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .role-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .role-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: var(--primary);
        }
        .role-card.tv-role {
            border-color: rgba(255, 255, 255, 0.05);
            opacity: 0.8;
        }
        .role-card.tv-role:hover {
            border-color: var(--accent);
            opacity: 1;
        }
        .pin-section {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.3s forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-gray);
        }
        .form-group input {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: inherit;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 5px;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        .btn.back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            margin-top: 10px;
        }
        .btn.back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="login-card">
        <h1 id="main-title">Оберіть вашу роль</h1>
        
        <div class="role-grid" id="role-selection">
            <div class="role-card" onclick="selectRole('MANAGER')">
                <i class="ph ph-briefcase"></i> Менеджер / Адміністратор
            </div>
            <div class="role-card" onclick="selectRole('WORKER')">
                <i class="ph ph-wrench"></i> Працівник
            </div>
            <div class="role-card tv-role" onclick="selectRole('TV')">
                <i class="ph ph-monitor"></i> ТВ-Дашборд
            </div>
        </div>

        <div class="pin-section" id="pin-section">
            <form id="login-form">
                <p style="color: var(--text-gray); margin-bottom: 20px;" id="pin-subtitle">Введіть ваш PIN код для входу</p>
                <div class="form-group hidden" id="worker-select-group" style="margin-bottom: 15px; text-align: center;">
                    <button type="button" id="start-scan-btn" class="btn" style="margin-bottom: 15px; background: var(--secondary);"><i class="ph ph-qr-code"></i> Сканувати бейдж</button>
                    <div id="qr-reader" style="width: 100%; margin-bottom: 15px; display: none; border-radius: 12px; overflow: hidden;"></div>
                    <p style="color: var(--text-gray); margin-bottom: 10px;">Або оберіть зі списку:</p>
                    <select id="worker-select" class="form-control" style="width: 100%; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.05); color: var(--text-primary); border: 1px solid var(--glass-border);">
                        <option value="">Оберіть працівника...</option>
                    </select>
                </div>
                <div class="form-group">
                    <!-- 4 digits suits an operator tapping a shared tablet all shift, but it was
                         also the hard maximum, which left the administrator account - the one that
                         can do everything - with 10 000 possible PINs. The range is 4-8 so a
                         manager or admin can pick something stronger without slowing the floor down. -->
                    <input type="password" inputmode="numeric" id="pin" required placeholder="PIN код" minlength="4" maxlength="8" pattern="\d{4,8}">
                </div>
                <button type="submit" class="btn" id="login-btn">Увійти</button>
                <button type="button" class="btn back-btn" onclick="backToRoles()">Назад</button>
            </form>
        </div>
        
        <div id="toast-container"></div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="js/api.js"></script>
    <script>
        let selectedRole = null;
        let html5QrcodeScanner = null;

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            if (token && userStr) {
                try {
                    const user = JSON.parse(userStr);
                    const role = user.systemRole || 'WORKER';
                    if (['MANAGER', 'ADMIN', 'DISPATCHER'].includes(role)) {
                        window.location.href = 'manager.html';
                    } else {
                        window.location.href = 'worker.html';
                    }
                } catch(e) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            }
        });

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.style.cssText = 'padding: 1rem; margin-top: 1rem; border-radius: 8px; color: white; opacity: 0.9; font-weight: 500; font-size: 0.9rem;';
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#3b82f6';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('role-selection').style.display = 'none';
            document.getElementById('pin-section').style.display = 'block';
            
            const title = document.getElementById('main-title');
            const workerSelectGroup = document.getElementById('worker-select-group');
            const workerSelect = document.getElementById('worker-select');
            
            if (role === 'MANAGER') {
                title.innerText = 'Вхід для Менеджера';
                workerSelectGroup.classList.add('hidden');
                workerSelect.removeAttribute('required');
            }
            else if (role === 'WORKER') {
                title.innerText = 'Вхід для Працівника';
                workerSelectGroup.classList.remove('hidden');
                workerSelect.setAttribute('required', 'true');
                loadWorkersForLogin();
            }
            else if (role === 'TV') {
                title.innerText = 'Запуск ТВ-Дашборду';
                workerSelectGroup.classList.add('hidden');
                workerSelect.removeAttribute('required');
            }
            
            document.getElementById('pin').focus();
        }

        async function loadWorkersForLogin() {
            try {
                const res = await fetch(API_BASE + '/auth/workers');
                if (!res.ok) throw new Error('Failed to fetch workers');
                const workers = await res.json();
                
                const select = document.getElementById('worker-select');
                select.innerHTML = '<option value="">Оберіть своє ім\'я...</option>';
                workers.forEach(w => {
                    const opt = document.createElement('option');
                    opt.value = w.id;
                    opt.innerText = w.name;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error('Error loading workers:', err);
                showToast('Не вдалося завантажити список працівників', 'warning');
            }
        }

        function backToRoles() {
            selectedRole = null;
            document.getElementById('role-selection').style.display = 'grid';
            document.getElementById('pin-section').style.display = 'none';
            document.getElementById('main-title').innerText = 'Оберіть вашу роль';
            document.getElementById('login-form').reset();
            stopScanner();
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(err => console.error("Failed to clear scanner", err));
                html5QrcodeScanner = null;
                document.getElementById('qr-reader').style.display = 'none';
                document.getElementById('start-scan-btn').style.display = 'block';
            }
        }

        document.getElementById('start-scan-btn').addEventListener('click', () => {
            const qrReader = document.getElementById('qr-reader');
            qrReader.style.display = 'block';
            document.getElementById('start-scan-btn').style.display = 'none';
            
            html5QrcodeScanner = new Html5Qrcode("qr-reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // Assuming decodedText is the worker ID
                    const select = document.getElementById('worker-select');
                    const optionExists = Array.from(select.options).some(opt => opt.value === decodedText);
                    
                    if(optionExists) {
                        select.value = decodedText;
                        showToast("Бейдж розпізнано успішно!", "success");
                        stopScanner();
                    } else {
                        showToast("Працівника не знайдено!", "error");
                    }
                },
                (errorMessage) => {
                    // Ignore scan errors, they happen continuously until a QR is found
                }
            ).catch((err) => {
                showToast("Помилка доступу до камери", "error");
                stopScanner();
            });
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pin = document.getElementById('pin').value;
            const workerId = document.getElementById('worker-select').value;
            const btn = document.getElementById('login-btn');
            
            try {
                btn.innerText = 'Завантаження...';
                btn.disabled = true;
                
                // The server decides whether this role may sign in on this screen, and refuses
                // before issuing a token. The checks that used to live below did it afterwards,
                // by which point a usable token had already been handed out.
                const payload = { pin, loginContext: selectedRole };
                if (selectedRole === 'WORKER' && workerId) {
                    payload.workerId = workerId;
                }

                const res = await apiPost('/auth/login/pin', payload);
                const role = res.worker.systemRole || 'WORKER';

                // Reaching this point means the server already accepted both the PIN and the
                // screen it was typed on, so there is nothing left to check here. The TV screen
                // in particular only ever admits a dedicated TV-role account, whose token can
                // read the dashboard and nothing else - which matters because that token sits
                // in a URL on a display left running in the workshop.
                if (selectedRole === 'TV') {
                    window.location.href = `tv.html?token=${res.token}`;
                    return;
                }

                localStorage.setItem('token', res.token);
                localStorage.setItem('user', JSON.stringify(res.worker));

                if (selectedRole === 'MANAGER') {
                    window.location.href = 'manager.html';
                } else if (selectedRole === 'WORKER') {
                    window.location.href = 'worker.html';
                }
            } catch (err) {
                // One message for every rejection. Distinguishing "no such PIN" from "that PIN
                // belongs to someone who cannot sign in here" would confirm to whoever is
                // typing that the PIN exists, which is the one thing the sign-in screen must
                // not tell them.
                showToast('Невірний PIN', 'error');
                const pinField = document.getElementById('pin');
                pinField.value = '';
                pinField.focus();
            } finally {
                btn.innerText = 'Увійти';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
