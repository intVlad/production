version: '3.8'

# Copy .env.example to .env and fill it in before the first run. The backend refuses to start
# against a persistent database without JWT_SECRET, and creates no accounts unless you give it
# APP_BOOTSTRAP_ADMIN_PIN once.

services:
  db:
    image: postgres:15
    container_name: production_mvp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-production_mvp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host: only the backend needs to reach the database, and mapping
    # 5432 outward exposes it to anything that can reach this machine.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-production_mvp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: production_mvp_backend
    ports:
      - "8080:8080"
    environment:
      # One variable decides the database; Spring Boot infers the driver from the URL.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-production_mvp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Only needed for the very first start, to create the one account you sign in with.
      # Remove it afterwards.
      APP_BOOTSTRAP_ADMIN_PIN: ${APP_BOOTSTRAP_ADMIN_PIN:-}
      # The UI is served from the same host on a different port here, which is a different
      # origin as far as the browser is concerned.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: production_mvp_frontend
    ports:
      - "8000:80"
    restart: unless-stopped

volumes:
  postgres_data:
