# Self-hosted deployment: one application container (API + UI) and a database.
#
# Copy .env.example to .env and fill it in before the first run. The application refuses to
# start against a persistent database without JWT_SECRET, and creates no accounts unless you
# give it APP_BOOTSTRAP_ADMIN_PIN once.

services:
  db:
    image: postgres:15
    container_name: production_mvp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-production_mvp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host: only the application needs to reach the database, and mapping
    # 5432 outward exposes it to anything that can reach this machine.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-production_mvp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      # Repository root, so the image can bundle both the API and the UI - see Dockerfile.
      context: .
    container_name: production_mvp_app
    ports:
      - "8080:8080"
    environment:
      # One variable decides the database; Spring Boot infers the driver from the URL.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-production_mvp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Only needed for the very first start, to create the one account you sign in with.
      # Remove it afterwards.
      APP_BOOTSTRAP_ADMIN_PIN: ${APP_BOOTSTRAP_ADMIN_PIN:-}
      # Not set: the UI is served by this same container, so the browser never makes a
      # cross-origin request and CORS is not involved.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
